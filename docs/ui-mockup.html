<!doctype html>
<!-- KAVROS AFK WARDEN • single-file UI reference
     Open locally in a browser. ?view=overlay or ?view=settings isolates one window.
     For Grok: port these layouts to the app's existing WinForms controls, or host
     the HTML in a WebView. Bind the named fields and actions to the existing Warden
     settings, capture and alert services. The sample values below are display data.
     Host API: window.AFKWarden.updateStatus({...}), .setClients([...]), .setSettings({...}).
     Events: warden:setting {key,value}, warden:action {action,client}.
     A host can preventDefault() on a warden:action to handle it without the preview response. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavros · AFK Warden</title>
<style>
:root{color-scheme:dark;--bg:#0a1219;--panel:#13222c;--input:#0b1720;--button:#1a2b38;--line:#2c4555;--dim:#a8bac4;--text:#edf3f5;--gold:#edc568;--mint:#91e6bf;--ui:Outfit,"Segoe UI",sans-serif;--title:Cinzel,Georgia,serif}
*{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 14% 3%,#23362f 0,transparent 50%),linear-gradient(125deg,#151e25,#091017 85%);color:var(--text);font:15px/1.35 var(--ui)}
.desktop{width:min(1280px,100%);padding:clamp(12px,2.8vw,40px);margin:auto;display:grid;grid-template-columns:minmax(340px,0.66fr) minmax(545px,1fr);gap:clamp(16px,2vw,28px);align-items:start}
.window{min-width:0;background:var(--bg);border:1px solid #456071;border-radius:8px;box-shadow:0 16px 38px #0006;overflow:hidden}
button,select,input{font:inherit}button{background:var(--button);color:var(--text);border:1px solid #365265;border-radius:4px;min-height:32px;padding:4px 12px;cursor:pointer}
button:hover{background:#253c4c;border-color:#668797}button:active{transform:translateY(1px)}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{background:var(--gold);border-color:#dfb85d;color:#1a1916;font-weight:600}.primary:hover{background:#f4d789;color:#121516}
.overlay-head,.titlebar{background:#0e1b24;display:flex;align-items:center;gap:7px;padding:7px 10px}.overlay-head{border-top:2px solid var(--gold);border-bottom:1px solid var(--line)}.overlay-head h1{font:600 15px var(--title);letter-spacing:.10em;flex:1;margin:0}.small-btn{min-height:28px;padding:2px 9px;font-size:13px}.square{width:30px;padding:0}
.overlay-body{padding:14px}.connection,.overlay-row{display:flex;align-items:center;gap:12px}.connection{border-bottom:1px solid var(--line);padding-bottom:12px;font-size:14px}.connection span:last-child{overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;white-space:nowrap;font-weight:600;font-size:11px;letter-spacing:.035em;text-transform:uppercase;color:var(--mint);background:#172e28;border:1px solid #3b6657;border-radius:20px;padding:4px 8px}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.warn{background:#29271f;border-color:#655434;color:var(--gold)}.chip.mute{color:var(--dim);background:#1a262d;border-color:#40505b}
.overlay-row{min-height:34px;margin-top:5px;display:grid;grid-template-columns:112px 1fr;font-size:16px;font-variant-numeric:tabular-nums}.overlay-row .chip{justify-self:start}.overlay-row [data-status]{line-height:1.25}.meter{height:4px;border-radius:4px;background:#24343b;overflow:hidden;max-width:215px;margin-top:6px}.meter span{display:block;height:100%;background:var(--gold);width:99.7%}.overlay-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.titlebar{font-size:13px;border-bottom:2px solid var(--gold);min-height:31px}.titlebar .mark{color:var(--gold);font-size:17px}.titlebar .window-buttons{margin-left:auto;display:flex;gap:7px}.titlebar button{min-height:23px;min-width:27px;background:transparent;border:0;padding:0 5px}.titlebar button:hover{background:#29404d}
.brand{display:flex;align-items:center;gap:14px;margin:16px 19px 13px}.crest{background:var(--crest) center/contain no-repeat;width:64px;height:64px;flex:none}.kavros{color:var(--gold);font:600 12px var(--title);letter-spacing:.31em}.brand h2{font:600 clamp(21px,2vw,27px)/1.2 var(--title);letter-spacing:.08em;margin:5px 0 0}
.content{padding:0 15px 12px}.panel{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:13px 15px;margin:0 0 11px}
h3{font:600 12px var(--title);letter-spacing:.19em;color:var(--gold);margin:0 0 12px}
.watchline{display:flex;align-items:center;gap:10px}.watchline select{width:100%;min-width:0;flex:1}.watchline button{min-width:82px}
select,input[type=number]{border:1px solid #3c5667;border-radius:3px;color:var(--text);background:var(--input);padding:4px 7px;min-height:30px}select{padding-right:20px}.watch-foot{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:7px}.watch-foot .small-btn{margin-left:auto}
label{cursor:pointer}.toggle{display:inline-flex;align-items:center;gap:7px}.toggle input,input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;cursor:pointer;flex:none;margin:0;vertical-align:middle}.watch-foot .toggle{margin-left:8px}
table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:600}th,td{padding:7px 0;border-bottom:1px solid var(--line)}th:first-child{width:38%}th:nth-child(2){width:40%}th:nth-child(n+3),td:nth-child(n+3){text-align:center}tr:last-child td{border-bottom:0}.threshold{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;color:var(--dim);font-size:13px}input[type=number]{width:56px;text-align:center;padding:3px;font-variant-numeric:tabular-nums;appearance:textfield}input::-webkit-inner-spin-button{appearance:none}.unitcheck{font-size:12px}.unitcheck input{width:12px;height:12px}.lead{display:inline-flex;align-items:center;gap:4px}.lead input{width:40px}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px}.field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim)}.field input{color:var(--text)}.range{grid-column:1/-1;display:flex;align-items:center;gap:12px}.range input{accent-color:var(--gold);width:min(240px,60%);height:6px;cursor:pointer}.range output{color:var(--dim);font-size:12px}.pins,.actions{display:flex;flex-wrap:wrap;gap:7px}.pins{margin-top:14px}.pins button,.actions button{font-size:13px}.actions{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.credit{text-align:center;font-size:12px;color:var(--dim);padding:0 10px 12px}.notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:min(420px,94vw);padding:10px 17px;border:1px solid #7c6b44;border-radius:5px;color:#f5e4bc;background:#18232a;box-shadow:0 6px 20px #0007}
body[data-view=overlay] .desktop,body[data-view=settings] .desktop{display:block;max-width:750px}body[data-view=overlay] .desktop{max-width:445px}
@media(max-width:950px){.desktop{grid-template-columns:1fr;max-width:750px}.overlay{width:min(100%,430px)}}
@media(max-width:550px){body{font-size:14px}.desktop{padding:8px;gap:12px}.content{padding:0 8px 8px}.panel{padding:10px}.brand{margin:12px}.crest{width:48px;height:48px}.channels{gap:10px}.alerts th{font-size:9px}.alerts th:first-child{width:35%}.alerts th:nth-child(2){width:41%}.alerts tr td{padding:7px 2px}.alerts .toggle{gap:4px}.threshold input[type=number]{width:39px}.watch-foot .toggle{margin:0}.credit{padding-bottom:9px}}
</style></head><body>
<main class="desktop">
<section class="window overlay" id="overlay" aria-label="AFK Warden overlay">
<header class="overlay-head"><h1>AFK Warden</h1><button class="small-btn" data-action="settings">Settings</button><button class="small-btn square" data-action="fold" aria-label="Collapse overlay" aria-expanded="true">−</button></header>
<div class="overlay-body" id="overlay-body">
<div class="connection"><span class="chip" data-indicator>Game detected</span><span data-status="client">Kavros 944 | NXT LIVE</span></div>
<div class="overlay-row"><span class="chip">Movement</span><span data-status="movement">Still for 14s</span></div>
<div class="overlay-row"><span class="chip">Hitpoints</span><span data-status="hp">6,060</span></div>
<div class="overlay-row"><span class="chip warn">Prayer</span><span data-status="prayer">Unread</span></div>
<div class="overlay-row"><span class="chip warn">Potions</span><span data-status="potions">No buffs</span></div>
<div class="overlay-row"><span class="chip">AFK timer</span><div><span data-status="remaining">4:59 left</span><div class="meter" aria-hidden="true"><span></span></div></div></div>
<div class="overlay-actions"><button class="primary" data-action="pause">Resume</button><button data-action="exit">Exit</button></div></div></section>

<section class="window settings" id="settings" aria-label="AFK Warden settings">
<div class="titlebar"><span aria-hidden="true" class="mark">⚙</span> AFK Warden <div class="window-buttons"><button data-action="hide-settings" aria-label="Hide settings">−</button><button data-action="hide-settings" aria-label="Close settings">×</button></div></div>
<header class="brand"><div class="crest" role="img" aria-label="Kavros crest"></div><div><div class="kavros">KAVROS</div><h2>AFK WARDEN</h2></div></header>
<div class="content">
<section class="panel"><h3>Watch</h3>
<div class="watchline"><select id="client" aria-label="Game client"><option>Kavros 944 | NXT LIVE</option></select><button data-action="refresh">Refresh</button></div>
<div class="watch-foot"><span class="chip" data-indicator>Game detected</span><label class="toggle"><input type="checkbox" data-key="paused" checked>Pause watching</label><button class="small-btn" data-action="pick-client">Pick client</button></div></section>

<section class="panel alerts"><h3>Alerts</h3><table aria-label="Alert settings"><thead><tr><th scope="col">Alert</th><th scope="col">Threshold</th><th scope="col">Sound</th><th scope="col">Notify</th></tr></thead><tbody id="alert-rows"></tbody></table></section>

<section class="panel"><h3>Channels</h3><div class="channels">
<label class="toggle"><input type="checkbox" data-key="sounds" checked>Play sounds</label>
<label class="toggle"><input type="checkbox" data-key="notifications" checked>Show notifications</label>
<label class="field">Cooldown <input type="number" min="0" step="1" value="20" data-key="cooldown"> sec</label>
<label class="field">Duration <input type="number" min="1" step="1" value="8" data-key="duration"> sec</label>
<label class="range">Volume <input type="range" min="0" max="100" value="80" data-key="volume"><output id="volume">80%</output></label>
<label class="toggle"><input type="checkbox" data-key="startupUpdates" checked>Check for updates at startup</label>
<label class="toggle"><input type="checkbox" data-key="debug">Save debug capture</label></div>
<div class="pins"><button data-action="pin-hp">Pin hitpoints</button><button data-action="pin-prayer">Pin prayer</button><button data-action="pin-buffs">Pin buff bar</button><button data-action="clear-pins">Clear pins</button></div>
<div class="actions"><button class="primary" data-action="test-notification">Test notification</button><button data-action="test-sound">Test sound</button><button data-action="updates">Check for updates</button></div></section></div>
<footer class="credit">Made by Zenity · <span data-status="version">v0.2.5</span></footer></section></main>
<div id="notice" class="notice" role="status" hidden></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const all = s => [...document.querySelectorAll(s)];
const alerts = [
  ["idle","Idle alert",12,"sec"],["hp","Low hitpoints",30,"percent"],
  ["prayer","Low prayer",20,"percent"],["potion","Potion running out",15,"sec"],
  ["afk","AFK teleport warning",300,"sec"]
];
for (const [id,label,initial,unit] of alerts) {
  const row=document.createElement("tr");
  const key="alert."+id+".";
  function check(suffix,title){return '<input type="checkbox" checked data-key="'+key+suffix+'" aria-label="'+title+'">';}
  function number(suffix,title,value){return '<input type="number" min="1" step="1" data-key="'+key+suffix+'" aria-label="'+title+'" value="'+value+'">';}
  let threshold=number("threshold",label+" threshold",initial);
  threshold+=unit==="percent"?'<label class="toggle unitcheck">'+check("percent",label+" uses percent")+'%</label>':" sec";
  if(id==="afk")threshold+='<label class="lead">Lead '+number("lead","AFK warning lead time",30)+' sec</label>';
  row.innerHTML='<td><label class="toggle">'+check("enabled",label+" enabled")+label+'</label></td><td><div class="threshold">'+threshold+'</div></td><td>'+check("sound",label+" sound")+'</td><td>'+check("notify",label+" notification")+'</td>';
  $("#alert-rows").append(row);
}
const fields=new Map(all("[data-key]").map(el=>[el.dataset.key,el]));
const view=new URLSearchParams(location.search).get("view");
if(view==="overlay"||view==="settings"){document.body.dataset.view=view;$(view==="overlay"?"#settings":"#overlay").hidden=true;}
let toastTimer;
function notice(message){const el=$("#notice");clearTimeout(toastTimer);el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},3500);}
function action(name){
  return window.dispatchEvent(new CustomEvent("warden:action",{cancelable:true,detail:{action:name,client:$("#client").value}}));
}
function getValue(el){return el.type==="checkbox"?el.checked:el.type==="number"||el.type==="range"?el.valueAsNumber:el.value;}
function sync(){
  $('[data-action="pause"]').textContent=fields.get("paused").checked?"Resume":"Pause";
  $("#volume").textContent=fields.get("volume").value+"%";
}
function sendSetting(el){
  if(!el.validity.valid||el.value===""){el.reportValidity();return;}
  sync();window.dispatchEvent(new CustomEvent("warden:setting",{detail:{key:el.dataset.key,value:getValue(el)}}));
}
for(const el of fields.values()){el.addEventListener("change",()=>sendSetting(el));}
fields.get("volume").addEventListener("input",sync);
$("#client").addEventListener("change",()=>{if(action("select-client"))updateStatus({client:$("#client").selectedOptions[0]?.textContent||"No client"});});
function updateStatus(values){
  for(const el of all("[data-status]"))if(Object.hasOwn(values,el.dataset.status))el.textContent=String(values[el.dataset.status]??"Unread");
  if("connected" in values)for(const el of all("[data-indicator]")){el.textContent=values.connected?"Game detected":"Disconnected";el.classList.toggle("mute",!values.connected);}
  if(Number.isFinite(values.remainingFraction))$(".meter span").style.width=(100*Math.min(1,Math.max(0,values.remainingFraction)))+"%";
}
function setSettings(values){
  for(const [key,value] of Object.entries(values)){const el=fields.get(key);if(!el)continue;if(el.type==="checkbox")el.checked=Boolean(value);else el.value=value;}
  sync();
}
function setClients(clients,selected){
  const select=$("#client");select.replaceChildren();
  for(const item of clients){const option=new Option(item.name,item.id);option.selected=item.id===selected;select.add(option);}
}
window.AFKWarden={updateStatus,setSettings,setClients,getSettings:()=>Object.fromEntries([...fields].map(([key,el])=>[key,getValue(el)]))};
document.addEventListener("click",async event=>{
  const btn=event.target.closest("[data-action]");if(!btn)return;
  const name=btn.dataset.action;
  if(!action(name))return;
  switch(name){
    case "settings":$("#settings").hidden=false;$("#settings").scrollIntoView({block:"nearest"});$("#client").focus({preventScroll:true});break;
    case "hide-settings":$("#settings").hidden=true;$("#overlay").hidden=false;$('[data-action="settings"]').focus();break;
    case "fold":{const body=$("#overlay-body");body.hidden=!body.hidden;btn.textContent=body.hidden?"+":"−";btn.setAttribute("aria-expanded",String(!body.hidden));btn.setAttribute("aria-label",body.hidden?"Expand overlay":"Collapse overlay");break;}
    case "pause":{const el=fields.get("paused");el.checked=!el.checked;sendSetting(el);break;}
    case "test-notification":notice("AFK Warden · Test notification");break;
    case "test-sound":{
      try{const ctx=new AudioContext();await ctx.resume();const tone=ctx.createOscillator(),gain=ctx.createGain();tone.frequency.value=660;gain.gain.value=Number(fields.get("volume").value)/1000;tone.connect(gain);gain.connect(ctx.destination);tone.onended=()=>ctx.close();tone.start();tone.stop(ctx.currentTime+.16);}
      catch{notice("Audio preview unavailable in this browser.");}break;}
    case "pick-client":$("#client").focus();break;
    default:notice(btn.textContent+" uses the desktop app connection.");break;
  }
});
sync();
</script>
